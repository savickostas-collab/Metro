plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// GitHub Actions passes its run number so every build installs over the previous one.
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.metro.start'
    compileSdk 34

    defaultConfig {
        applicationId 'com.metro.start'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "2.0.$buildNumber"
    }

    // One fixed key (committed on purpose) so updates install without uninstalling.
    signingConfigs {
        metro {
            storeFile rootProject.file('keystore/metro.jks')
            storePassword 'metrolauncher'
            keyAlias 'metro'
            keyPassword 'metrolauncher'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.metro
        }
        debug {
            signingConfig signingConfigs.metro
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
