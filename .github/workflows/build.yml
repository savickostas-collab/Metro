name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Run tests
        run: chmod +x gradlew && ./gradlew --no-daemon testReleaseUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetroLauncher-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk MetroLauncher.apk
          gh release create "v2.0.${{ github.run_number }}" MetroLauncher.apk \
            --target "${{ github.sha }}" \
            --title "Metro Launcher 2.0 (build ${{ github.run_number }})" \
            --notes "Download MetroLauncher.apk below and install it. Then press Home and choose Metro > Always. Every build is signed with the same key, so new builds install over old ones."
